<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARTH VIEW — lab</title>
<link rel="stylesheet" href="_planetcore.css">
<style>
  /* LAB ONLY — a mock of an EARTH VIEW tab for the BEHIND THE BLUE widget.
     Geocentric top-down stage: the real Moon and Sun (same Schlyter/J2000
     core the solar map uses via _planetcore.js), the HYG starfield behind,
     and the near-Earth neighbourhood on log-compressed distance rings.
     Present through earthview_preview.html for the full widget chrome. */
  @font-face{
    font-family:"QelliaRegular";
    src:url('https://cdn.bluishvoid.com/qellia.woff2?v=1') format('woff2');
    font-display:swap;
  }
  :root{ --ink:#2B22F4; --ink-dim:rgba(43,34,244,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    display:flex;flex-direction:column;height:100%;
    background:#070d1d;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #stage{flex:1;min-height:0;position:relative;}
  /* embedded on desktop the host fixes the map height (inline on #stage) and
     sizes the frame to our content — see the spaceMapH message */
  html.fixed-map body{height:auto;min-height:0;}
  html.fixed-map #stage{flex:none;}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #map text{font-family:'QelliaRegular','Bodoni Moda',Georgia,serif;}
  #map text.data{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

  /* ── footer HUD: same white in-flow strip idiom as the solar lab ── */
  #hud{
    flex:0 0 auto;background:#fff;color:var(--ink);
    padding:9px 14px 11px;display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  #hud-controls,#subviews{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .pill{
    border:1px solid rgba(43,34,244,.22);border-radius:999px;background:rgba(43,34,244,.05);
    color:var(--ink);font-size:.62rem;font-weight:800;letter-spacing:.08em;
    padding:6px 13px;text-transform:uppercase;white-space:nowrap;
  }
  button.pill{cursor:pointer;font-family:inherit;}
  button.pill:hover{background:rgba(43,34,244,.11);}
  button.pill.on{background:rgba(43,34,244,.16);border-color:rgba(43,34,244,.45);}
  /* sub-view tabs: the solar lab's layer-pill treatment — orange fill,
     solid ink when active */
  #subviews .pill{background:#ea580c;border-color:#ea580c;color:#fff;}
  #subviews .pill:hover{background:#c2410c;border-color:#c2410c;}
  #subviews .pill.on{background:#2B22F4;border-color:#2B22F4;color:#fff;}
  #subviews .pill.on:hover{background:#231cc9;border-color:#231cc9;}
  #btn-play{background:#2f9e44;border-color:#2f9e44;color:#fff;padding:6px 17px;}
  #btn-play:hover{background:#37a84d;}
  #btn-iss-live .livedot{
    display:inline-block;width:6px;height:6px;border-radius:50%;background:#d94b3a;
    margin-right:7px;vertical-align:1px;
  }
  #readout{font-size:.78rem;font-weight:900;letter-spacing:.05em;padding:6px 15px;background:none;border:none;}
  select.pill{appearance:none;-webkit-appearance:none;text-align:center;}
  /* facts: MOON/SUN as slim solid-orange strips (their whole story is one
     line), then the fleet as WIDE cards — at most four per row, so every
     fact line fits whole. Chunking without the crush. */
  #facts{display:flex;flex-direction:column;align-items:center;gap:7px;width:100%;max-width:1400px;}
  .lrow{
    display:flex;align-items:center;justify-content:center;gap:14px;border-radius:9px;
    padding:5px 16px;width:100%;text-align:center;background:#ea580c;flex-wrap:wrap;
  }
  .lrow .ln{font-size:.52rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
            color:rgba(255,255,255,.92);}
  .lrow .lv{font-size:.68rem;font-weight:850;letter-spacing:.03em;color:#fff;}
  .lrow .ls{font-size:.56rem;font-weight:700;color:#fff;line-height:1.5;}
  .lrow.click{cursor:pointer;}
  .lrow.click:hover{filter:brightness(1.06);}
  .lrow.eclipse{background:var(--ink);}
  .lrow .ec-jump{cursor:pointer;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:1px;}
  .lrow .ec-jump:hover{border-bottom-color:#fff;}
  .factrow{display:flex;align-items:stretch;justify-content:center;gap:8px;flex-wrap:wrap;width:100%;}
  .fact{
    border-radius:13px;background:rgba(43,34,244,.055);
    padding:8px 16px 9px;text-align:center;flex:1 1 265px;max-width:430px;
    box-shadow:0 1px 5px rgba(43,34,244,.05);
  }
  .fact .k{font-size:.64rem;font-weight:900;letter-spacing:.15em;color:rgba(43,34,244,.62);text-transform:uppercase;
           display:flex;align-items:center;justify-content:center;gap:8px;}
  .fact .k .dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;}
  /* the stat row: SPEED · HEIGHT · COUNT in the same order on every card,
     so the bold numbers line up and compare across the fleet */
  .fact .stats{display:flex;justify-content:center;align-items:flex-start;gap:20px;margin-top:2px;}
  .fact .st .sl{font-size:.46rem;font-weight:900;letter-spacing:.14em;color:rgba(43,34,244,.45);text-transform:uppercase;white-space:nowrap;}
  .fact .st .sv{font-size:.72rem;font-weight:850;letter-spacing:.02em;color:var(--ink);margin-top:1px;white-space:nowrap;}
  .fact .st .su{font-size:.5rem;font-weight:800;letter-spacing:.08em;color:rgba(43,34,244,.5);text-transform:uppercase;white-space:nowrap;}
  .fact .s{font-size:.58rem;font-weight:700;color:rgba(43,34,244,.62);margin-top:1px;line-height:1.38;text-wrap:balance;}
  .fact.click{cursor:pointer;}
  .fact.click:hover{filter:brightness(1.05);}
  /* the altitude rail: every card shows where its shell sits between the
     earth's surface and the GEO belt, on the map's own log scale (rKm).
     Faint reference ticks at ISS / GPS / GEO; the card's marker takes the
     card color. Numbers say how high — the rail says where. */
  .fact .rail{position:relative;height:14px;margin:4px 12px 0;}
  .fact .rail::before{content:'';position:absolute;left:0;right:0;top:4px;height:1px;background:rgba(43,34,244,.16);}
  .fact .rail i{position:absolute;top:1.5px;width:1px;height:6px;background:rgba(43,34,244,.28);}
  .fact .rail b{position:absolute;top:2px;height:5px;border-radius:3px;}
  .fact .rail .rl{
    position:absolute;top:8.5px;transform:translateX(-50%);
    font-size:.38rem;font-weight:900;letter-spacing:.12em;color:rgba(43,34,244,.4);
  }
  .fact .rail .re{left:0;transform:none;}
  /* (the seven-card era's full-width DEBRIS band lived here — six cards
     make a clean 3+3, so every card is ordinary again) */
  /* the ISS dossier: replaces the controls + ledger while the feed plays */
  #iss-panel{display:none;flex-direction:column;gap:7px;align-items:center;width:100%;max-width:1400px;}
  /* the dossier body: live mini map + small portrait on the left,
     hazard-subtext-style prose on the right — no cards here */
  #iss-info{display:flex;gap:18px;width:100%;max-width:1150px;align-items:flex-start;text-align:left;}
  #iss-map-pane{flex:0 0 330px;max-width:44%;}
  #iss-map{position:relative;width:100%;aspect-ratio:2/1;border-radius:10px;overflow:hidden;background:#0a1430;}
  #iss-map img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #iss-map svg{position:absolute;inset:0;width:100%;height:100%;}
  #iss-map-cap{
    font-size:.44rem;font-weight:900;letter-spacing:.12em;color:rgba(43,34,244,.55);
    margin-top:4px;text-transform:uppercase;text-align:center;
  }
  #iss-map-leg{
    font-size:.38rem;font-weight:800;letter-spacing:.1em;color:rgba(43,34,244,.42);
    margin-top:2px;text-transform:uppercase;text-align:center;
  }
  #iss-map-leg i{display:inline-block;width:13px;height:0;vertical-align:2px;margin-right:4px;}
  #iss-map-leg .lp{border-top:2px solid rgba(90,100,140,.45);}
  #iss-map-leg .lc{border-top:2px dashed rgba(90,100,140,.85);}
  #iss-map-leg .lf{border-top:2px dashed #e8825a;}
  #iss-photo{display:block;width:100%;aspect-ratio:21/9;object-fit:cover;object-position:center 42%;border-radius:10px;margin-top:12px;}
  #iss-photo-cred{font-size:.38rem;font-weight:800;letter-spacing:.09em;color:rgba(43,34,244,.4);margin-top:3px;text-transform:uppercase;text-align:center;}
  /* two magazine columns keep the measure readable (one full-width
     column ran ~120 characters a line and read as a wall); labels sit
     on their own line as anchors. Narrow panes fall to one column. */
  #iss-prose{flex:1;min-width:0;columns:2 300px;column-gap:32px;}
  #iss-prose p{
    font-size:.66rem;line-height:1.62;color:rgba(20,24,60,.88);
    margin:0 0 12px;break-inside:avoid;
  }
  #iss-prose .lead{
    display:block;font-size:.5rem;font-weight:900;letter-spacing:.14em;color:#ea580c;
    text-transform:uppercase;margin-bottom:3px;
  }
  #iss-prose a{color:rgba(43,34,244,.85);text-decoration:underline;text-decoration-color:rgba(43,34,244,.4);}
  #iss-prose a:hover{color:var(--ink);}
  #iss-back2{background:#ea580c;border-color:#ea580c;color:#fff;padding:6px 17px;}
  button#iss-back2:hover{background:#c2410c;}
  #about-link{
    position:absolute;right:14px;bottom:10px;z-index:5;
    font-size:.52rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(178,196,240,.55);cursor:pointer;user-select:none;
    padding:4px 2px;
  }
  #about-link:hover{color:rgba(220,230,248,.95);}
  .fact .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

  /* ── mobile: the map keeps the screen; the fact cards scroll beneath it.
     Same surgery the solar lab needed — unbounded footer content squeezes
     the flex:1 stage toward nothing on a phone. ── */
  @media (max-width:768px){
    #stage{min-height:52vh;min-height:52svh;}
    #hud{flex:0 1 auto;min-height:0;padding:7px 8px 9px;gap:6px;}
    #facts{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;gap:3px;}
    #iss-panel{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;gap:3px;}
    #iss-info{flex-direction:column;gap:8px;}
    #iss-map-pane{flex:1 1 auto;max-width:100%;width:100%;}
    .pill{font-size:.56rem;padding:5px 10px;}
    #readout{font-size:.68rem;padding:5px 6px;}
    /* orange strips wrap: name + headline on the first line, details below */
    .lrow{flex-wrap:wrap;gap:2px 10px;padding:5px 10px;}
    .lrow .ln{flex:0 0 auto;}
    .lrow .lv{flex:1 0 auto;}
    .lrow .ls{flex:1 1 100%;}
    .factrow{gap:6px;}
    .fact{padding:6px 9px 7px;}
  }

  /* moon-dock mode: the moon popup sits INSIDE the map on the left as a
     clean panel — no dimmed/blurred backdrop, the moon stays visible
     beside it. Scoped to this lab; the site's modal CSS is untouched. */
  /* the popup lives INSIDE the backdrop element, so the backdrop stays but
     goes invisible + click-through — the map remains live beside the panel */
  html.moon-dock #planet-insight-backdrop{
    background:transparent !important;
    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;
    pointer-events:none !important;
  }
  html.moon-dock #planet-insight-popup{
    left:14px !important; right:auto !important; top:14px !important;
    transform:none !important;
    width:min(400px, calc(100vw - 28px)) !important;
    max-height:calc(var(--stage-h, 70vh) - 28px) !important;
    overflow-y:auto;
    pointer-events:auto !important;
    box-shadow:0 18px 50px rgba(4,8,24,.5);
  }

  #sat-popup{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;
    background:rgba(10,17,34,.45);
  }
  #sat-popup.open{display:flex;}
  #sat-card{
    width:min(400px, calc(100vw - 40px));max-height:calc(100% - 60px);overflow-y:auto;
    background:#fff;border-radius:18px;padding:18px 20px 16px;position:relative;
    box-shadow:0 24px 70px rgba(4,8,24,.5);
  }
  #sat-close{
    position:absolute;top:10px;right:12px;border:none;background:none;cursor:pointer;
    font-size:1rem;line-height:1;color:rgba(43,34,244,.45);padding:6px;font-family:inherit;
  }
  #sat-close:hover{color:var(--ink);}
  #sat-card .sp-sub{
    font-size:.52rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(43,34,244,.5);
  }
  #sat-card h2{
    font-family:'QelliaRegular','Bodoni Moda',Georgia,serif;
    font-size:1.35rem;font-weight:400;letter-spacing:.04em;color:var(--ink);
    margin:2px 24px 10px 0;line-height:1.15;
  }
  #sat-card .story{
    font-size:.78rem;line-height:1.55;color:rgba(20,24,60,.9);margin:11px 0 4px;
  }
  #sat-card .rows{margin-top:9px;}
  #sat-card .row{
    display:flex;justify-content:space-between;gap:14px;
    padding:5px 0;border-top:1px solid rgba(43,34,244,.09);
    font-size:.62rem;font-weight:800;letter-spacing:.05em;
  }
  #sat-card .row .k{color:rgba(43,34,244,.5);text-transform:uppercase;letter-spacing:.12em;}
  #sat-card .row .v{color:var(--ink);text-align:right;}
  /* ── the ISS live feed takes over the stage: player edge to edge on the
     space-dark ground (YouTube letterboxes itself into the near-16:9 frame),
     a dark-glass BACK pill top-right (YouTube owns the top-left before
     play), and a scrim bar of live numbers along the bottom. ── */
  #live-view{position:absolute;inset:0;z-index:8;display:none;background:#04060f;}
  #live-view.on{display:block;}
  #lv-frame,#lv-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  #lv-back{
    position:absolute;top:12px;right:14px;z-index:2;cursor:pointer;font-family:inherit;
    font-size:.56rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:#eef2fb;background:rgba(10,17,34,.72);border:1px solid rgba(220,230,248,.35);
    border-radius:999px;padding:7px 14px;
  }
  #lv-back:hover{background:rgba(24,32,58,.88);}
  #lv-bar{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px 20px;
    padding:14px 14px 8px;background:linear-gradient(transparent, rgba(4,8,24,.85) 55%);
    font-size:.54rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:rgba(178,196,240,.8);white-space:nowrap;
  }
  #lv-bar b{color:#fff;font-weight:900;margin-left:6px;}
  #lv-bar .lv-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;background:#d94b3a;
    margin-right:6px;vertical-align:1px;
  }
  #lv-bar .lv-note{color:rgba(178,196,240,.55);}
  #lv-bar a{color:#9db4e8;text-decoration:none;}
  #lv-bar a:hover{color:#fff;}
</style>
</head>
<body>
<div id="stage">
  <div id="about-link">DATA &amp; METHOD &#8505;&#xFE0E;</div>
  <!-- the ISS live feed takes over the whole stage; the map waits underneath.
       The iframe is injected on open and torn out on close. -->
  <div id="live-view">
    <div id="lv-frame"></div>
    <button id="lv-back">&#10005;&#xFE0E; BACK TO THE MAP</button>
    <div id="lv-bar">
      <span class="lv-stat"><i class="lv-dot"></i>ISS LIVE</span>
      <span class="lv-stat">ALTITUDE<b id="lv-alt">&mdash;</b></span>
      <span class="lv-stat">SPEED<b id="lv-spd">&mdash;</b></span>
      <span class="lv-stat">FLOWN WHILE YOU WATCH<b id="iss-odo">0 MI</b></span>
      <span class="lv-stat lv-note">A DARK SCREEN IS JUST ORBITAL NIGHT</span>
      <a id="lv-src" href="https://www.youtube.com/watch?v=awQzjn72bI0" target="_blank" rel="noopener">&#9654;&#xFE0E; WATCH AT SOURCE &#8599;&#xFE0E;</a>
    </div>
  </div>
  <svg id="map" viewBox="-660 -640 1320 1180" preserveAspectRatio="xMidYMid meet" aria-label="Earth view">
    <defs>
      <radialGradient id="spaceGrad" cx="50%" cy="46%" r="75%">
        <stop offset="0%"  stop-color="#0c1430"/>
        <stop offset="55%" stop-color="#091026"/>
        <stop offset="100%" stop-color="#060b19"/>
      </radialGradient>
      <!-- one coherent glare: photographic ~1/r2 falloff (many stops so the
           big radius doesn't band on the dark sky), a hot bloom hugging the
           disc, and a faint horizontal lens streak -->
      <radialGradient id="sunGlare">
        <stop offset="0%"  stop-color="#fff7e6" stop-opacity=".95"/>
        <stop offset="5%"  stop-color="#ffedc4" stop-opacity=".55"/>
        <stop offset="11%" stop-color="#ffdf9e" stop-opacity=".34"/>
        <stop offset="20%" stop-color="#f9cd7a" stop-opacity=".2"/>
        <stop offset="34%" stop-color="#f0bd66" stop-opacity=".13"/>
        <stop offset="55%" stop-color="#e8b25c" stop-opacity=".06"/>
        <stop offset="78%" stop-color="#e0a855" stop-opacity=".02"/>
        <stop offset="100%" stop-color="#dda050" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunGlareCore">
        <stop offset="0%"  stop-color="#fffdf6" stop-opacity=".9"/>
        <stop offset="55%" stop-color="#ffe9b8" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunStreak">
        <stop offset="0%"  stop-color="#fff3d8" stop-opacity=".5"/>
        <stop offset="45%" stop-color="#ffe9b8" stop-opacity=".16"/>
        <stop offset="75%" stop-color="#ffe9b8" stop-opacity=".05"/>
        <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="earthGrad" cx="38%" cy="34%" r="80%">
        <stop offset="0%" stop-color="#7fb4e8"/>
        <stop offset="45%" stop-color="#3d7ec4"/>
        <stop offset="80%" stop-color="#1c4e8a"/>
        <stop offset="100%" stop-color="#123763"/>
      </radialGradient>
      <radialGradient id="moonGrad" cx="40%" cy="36%" r="80%">
        <stop offset="0%" stop-color="#e8e6e0"/>
        <stop offset="60%" stop-color="#b8b6b0"/>
        <stop offset="100%" stop-color="#8e8c88"/>
      </radialGradient>
      <!-- true top-down night side: dark falls off from the terminator (x=0)
           toward the anti-sun limb; the lit half stays untouched -->
      <linearGradient id="nightSide" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0%"  stop-color="#03071a" stop-opacity=".12"/>
        <stop offset="22%" stop-color="#03071a" stop-opacity=".58"/>
        <stop offset="100%" stop-color="#03071a" stop-opacity=".86"/>
      </linearGradient>
      <radialGradient id="atmoGlow">
        <stop offset="76%"  stop-color="#9fd0ff" stop-opacity="0"/>
        <stop offset="79.5%" stop-color="#bfe3ff" stop-opacity=".34"/>
        <stop offset="82%"  stop-color="#8fc2ff" stop-opacity=".2"/>
        <stop offset="87%"  stop-color="#6fa8f4" stop-opacity=".09"/>
        <stop offset="94%"  stop-color="#5f96e0" stop-opacity=".035"/>
        <stop offset="100%" stop-color="#5f96e0" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="earthClip"><circle r="46"/></clipPath>
      <radialGradient id="sunCore">
        <stop offset="0%"  stop-color="#fffdf4"/>
        <stop offset="55%" stop-color="#ffe9b0"/>
        <stop offset="100%" stop-color="#f7c96a"/>
      </radialGradient>
      <clipPath id="sunClip"><circle r="30"/></clipPath>
      <clipPath id="moonClip"><circle r="18"/></clipPath>
      <!-- explicit filter regions: default regions box-clip small elements -->
      <filter id="softTerm" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="2.4"/>
      </filter>
      <filter id="softTermM" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="1.1"/>
      </filter>
      <linearGradient id="dayRim" x1="0" y1="0" x2="1" y2="0">
        <stop offset="45%" stop-color="#fff6e1" stop-opacity="0"/>
        <stop offset="100%" stop-color="#fff6e1" stop-opacity=".55"/>
      </linearGradient>
      <linearGradient id="dayGlowGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#222222"/>
        <stop offset="38%"  stop-color="#555555"/>
        <stop offset="70%"  stop-color="#cccccc"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <mask id="dayGlowMask" maskUnits="userSpaceOnUse" x="-64" y="-64" width="128" height="128">
        <rect x="-64" y="-64" width="128" height="128" fill="url(#dayGlowGrad)"/>
      </mask>
      <linearGradient id="umbraFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#02040c" stop-opacity=".55"/>
        <stop offset="35%" stop-color="#02040c" stop-opacity=".3"/>
        <stop offset="100%" stop-color="#02040c" stop-opacity="0"/>
      </linearGradient>
      <filter id="umbraSoft" filterUnits="userSpaceOnUse" x="-100" y="-160" width="1200" height="320">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
      <filter id="eclSoft" filterUnits="userSpaceOnUse" x="-560" y="-150" width="1180" height="300">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
      <linearGradient id="umbraTail" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#04060f" stop-opacity=".62"/>
        <stop offset="60%" stop-color="#04060f" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#04060f" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="coneTail" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#04060f" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#04060f" stop-opacity=".6"/>
      </linearGradient>
      <radialGradient id="bloodGrad">
        <stop offset="0%"  stop-color="#c0532c"/>

<script src="_planetcore.js"></script>
<script src="_starfield.js"></script>

<script src="_roman.js"></script>
<script>
var LOCATION = { lat: 40.744, lon: -73.9213, tz: 'America/New_York', name: 'NYC' };
var DEG = Math.PI/180;
var MAP_R = 470;
var svgEl = document.getElementById('map');
function mk(tag, attrs, parent){
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) el.setAttribute(k, attrs[k]);
  (parent || svgEl).appendChild(el);
  return el;
}
/* map direction for an ecliptic longitude (radians): 0 right, CCW */
function dirXY(lonRad, r){ return [r*Math.cos(lonRad), -r*Math.sin(lonRad)]; }

/* ── distance rings: log-compressed km → px ── */
function rKm(km){
  return 70 + (Math.log(km/300) / Math.log(2000000/300)) * 400;
}
var R_ISS = rKm(420), R_GPS = rKm(20200), R_GEO = rKm(35786), R_L = rKm(1500000);

/* ── the real sky behind everything (same polar projection as the map) ── */
(function(){
  var g = document.getElementById('gStars');
  if (typeof STARS === 'undefined') return;
  function starColor(bv){
    if (bv <= 0)   return '#a8c2ff';
    if (bv <= 0.4) return '#e6eeff';
    if (bv <= 0.8) return '#fff4e2';
    if (bv <= 1.2) return '#ffe2b4';
    return '#ffc990';
  }
  for (var i = 0; i < STARS.length; i++){
    var s = STARS[i];
    if (s[2] > 6.0) continue;                      // keep the lab light
    var r = MAP_R * (90 - s[1]) / 90;
    var a = s[0] * DEG;
    var sz = Math.max(0.5, 1.9 - 0.24 * s[2]);
    mk('circle', {cx:(r*Math.cos(a)).toFixed(1), cy:(-r*Math.sin(a)).toFixed(1),
                  r:sz.toFixed(2), fill:starColor(s[3]),
                  opacity:(s[2] < 2 ? .9 : s[2] < 4 ? .55 : .3).toFixed(2)}, g);
  }
})();

/* ── static ring furniture ── */
(function(){
  var g = document.getElementById('gRings');
  /* each title curves ALONG its own ring (textPath on an arc just outside
     the dashed line, centered on its bearing), color-keyed to the ring's
     inhabitants, with a background-ink halo so it survives stars and
     satellite glyphs at any zoom */
  var rings = [
    {r:R_ISS, label:'ISS ORBIT · 254 MI',               ang:148, c:'#e6edf8', pad:11},
    {r:R_GPS, label:'GPS · 12,550 MI',                  ang:139, c:'#ffd27f'},
    {r:R_GEO, label:'GEOSTATIONARY RING · 22,236 MI',   ang:130, c:'#b9c9f0'},
    /* the graveyard is really ~190 mi above GEO — under 1 unit here on the
       log scale, so it draws a few units out to be seen (said in the DATA &
       METHOD popup) */
    {r:R_GEO + 5, label:'GRAVEYARD RING · RETIRED GEO SATS', ang:57, c:'#cbb6a6',
     dash:'rgba(203,182,166,.4)'},
    {r:R_L,   label:'L1 · L2 · ~932,000 MI',            ang:117, c:'#cdd6ea'}
  ];
  rings.forEach(function(rg, ri){
    mk('circle', {r:rg.r, fill:'none', stroke:rg.dash || 'rgba(150,172,225,.26)', 'stroke-width':.9,
                  'stroke-dasharray':'3 5', 'vector-effect':'non-scaling-stroke'}, g);
    var rl = rg.r + (rg.pad || 7);
    var a1 = (rg.ang + 55) * DEG, a2 = (rg.ang - 55) * DEG;
    mk('path', {id:'ringlab' + ri, fill:'none',
      d:'M' + (rl*Math.cos(a1)).toFixed(1) + ' ' + (-rl*Math.sin(a1)).toFixed(1) +
        'A' + rl + ' ' + rl + ' 0 0 1 ' +
        (rl*Math.cos(a2)).toFixed(1) + ' ' + (-rl*Math.sin(a2)).toFixed(1)}, g);
    var t = mk('text', {'class':'data', 'text-anchor':'middle',
      style:'font-size:0.6562em;font-weight:800;letter-spacing:.14em;fill:' + rg.c + ';' +
            'paint-order:stroke;stroke:#070d1d;stroke-width:.3em;stroke-linejoin:round;stroke-opacity:.85;'}, g);
    var tp = mk('textPath', {href:'#ringlab' + ri, startOffset:'50%'}, t);
    tp.textContent = rg.label;
  });
})();

/* ── the Van Allen belts: two donuts of trapped radiation — the invisible
   architecture the ring layout already obeys: the LEO shell hides BELOW the
   inner belt, GPS flies INSIDE the outer one (its electronics are hardened
   for exactly that), GEO sits at its outer edge. Schematic spans (inner
   ~620–3,700 mi, outer ~8,000–36,000 mi), painted under the starfield. ── */
(function(){
  var gb = document.getElementById('gBelts');
  mk('circle', {r:206.1, fill:'url(#beltInner)'}, gb);
  mk('circle', {r:309.2, fill:'url(#beltOuter)'}, gb);
  var g = document.getElementById('gRings');
  /* labels curve along the lower-left of each band; bottom arcs run the
     path the other way (a-55 -> a+55, sweep 0) or the text hangs inverted */
  [{r:176, a:212, c:'#e8b284', t:'INNER RADIATION BELT'},
   {r:317, a:216, c:'#9dd2e4', t:'OUTER RADIATION BELT · VAN ALLEN'}].forEach(function(b, i){
    var a1 = (b.a - 55) * DEG, a2 = (b.a + 55) * DEG;
    mk('path', {id:'beltlab' + i, fill:'none',
      d:'M' + (b.r*Math.cos(a1)).toFixed(1) + ' ' + (-b.r*Math.sin(a1)).toFixed(1) +
        'A' + b.r + ' ' + b.r + ' 0 0 0 ' +
        (b.r*Math.cos(a2)).toFixed(1) + ' ' + (-b.r*Math.sin(a2)).toFixed(1)}, g);
    var t = mk('text', {'class':'data', 'text-anchor':'middle',
      style:'font-size:0.6em;font-weight:800;letter-spacing:.15em;fill:' + b.c + ';opacity:.92;' +
            'paint-order:stroke;stroke:#070d1d;stroke-width:.3em;stroke-linejoin:round;stroke-opacity:.8;'}, g);
    mk('textPath', {href:'#beltlab' + i, startOffset:'50%'}, t).textContent = b.t;
  });
})();

/* ── earth's shadow: the umbra as a soft wedge swinging anti-solar. It sits
   UNDER the starfield (shadowed space is empty — stars shine through; it is
   the hardware that goes dark), and fleet + junk inside it draw dimmed:
   satellites vanish behind the Earth, which is why they disappear overhead
   an hour after dusk. Capped just past GEO — at the L ring and the Moon the
   flat top-down idiom would over-eclipse (JWST's halo orbit dodges the
   umbra; lunar eclipses need the real node geometry). ── */
var SH_LEN = R_GEO + 55, SH_HW = 43;
var gShadow = document.getElementById('gShadow');
mk('path', {d:'M0 -46 L' + SH_LEN + ' -30 L' + SH_LEN + ' 30 L0 46 Z',
            fill:'url(#umbraFade)', filter:'url(#umbraSoft)'}, gShadow);
var shUx = 1, shUy = 0;                     // anti-solar unit vector, set per frame
function inShadow(x, y){
  var t = x*shUx + y*shUy;
  if (t < 20 || t > SH_LEN) return false;
  var c = x*shUy - y*shUx;
  return (c < 0 ? -c : c) < SH_HW;
}

/* ── live pieces, updated per frame ── */
var gSun = document.getElementById('gSun'),
    gSats = document.getElementById('gSats'),
    gMoon = document.getElementById('gMoon'),
    gEarth = document.getElementById('gEarth');

/* sun: the real star, not just a wash — live SDO AIA 171 clipped into a
   disc (the site's Sun: disc is ~0.785 of the SDO frame, so oversize by
   1.274 to land the limb on the clip), layered glow behind it, parked at
   the map edge in the true geocentric direction */
var sunG = mk('g', {}, gSun);
mk('circle', {r:530, fill:'url(#sunGlare)'}, sunG);
mk('ellipse', {rx:250, ry:30, fill:'url(#sunStreak)', opacity:.6}, sunG);
mk('circle', {r:62, fill:'url(#sunGlareCore)'}, sunG);
mk('circle', {r:30, fill:'url(#sunCore)'}, sunG);
var sunImgG = mk('g', {'clip-path':'url(#sunClip)'}, sunG);
var sunImg = mk('image', {href:'https://sdo.gsfc.nasa.gov/assets/img/latest/latest_512_0171.jpg',
                          x:-38.2, y:-38.2, width:76.4, height:76.4,
                          preserveAspectRatio:'xMidYMid slice', opacity:0}, sunImgG);
sunImg.addEventListener('load', function(){ sunImg.setAttribute('opacity', 1); });
sunImg.addEventListener('error', function(){ sunImg.remove(); });
var sunLab = mk('text', {y:56, 'text-anchor':'middle',
  style:'font-size:1.1875em;font-weight:850;letter-spacing:.2em;fill:#ffd9a0;'}, sunG);
sunLab.textContent = 'SUN';

/* moon: real orbit ring at the current true distance + a half-lit disc */
var moonRing = mk('circle', {r:395, fill:'none', stroke:'rgba(232,214,180,.3)', 'stroke-width':1,
                             'vector-effect':'non-scaling-stroke'}, gMoon);
var moonG = mk('g', {}, gMoon);
mk('circle', {r:18, fill:'url(#moonGrad)'}, moonG);
/* real surface: a fully-lit frame from NASA SVS's LRO-based moon animation
   (disc ~0.46 of the 730px frame); gradient stays as the onerror fallback */
var moonImgG = mk('g', {'clip-path':'url(#moonClip)'}, moonG);
var moonImg = mk('image', {href:'https://svs.gsfc.nasa.gov/vis/a000000/a005100/a005187/frames/730x730_1x1_30p/moon.1300.jpg',
                           x:-39.1, y:-39.1, width:78.2, height:78.2,
                           preserveAspectRatio:'xMidYMid slice', opacity:0}, moonImgG);
moonImg.addEventListener('load', function(){ moonImg.setAttribute('opacity', 1); });
moonImg.addEventListener('error', function(){ moonImg.remove(); });
var moonNight = mk('g', {'clip-path':'url(#moonClip)'}, moonG);
var moonNightP = mk('path', {d:'M0,-18 A18,18 0 0 0 0,18 L0,-18 Z', fill:'url(#nightSide)',
                             filter:'url(#softTermM)'}, moonNight);
var moonRim = mk('circle', {r:17.2, fill:'none', stroke:'url(#dayRim)', 'stroke-width':1.6, opacity:.85}, moonG);
var moonLab = mk('text', {'text-anchor':'middle',
  style:'font-size:1.0625em;font-weight:850;letter-spacing:.16em;fill:#f4e9d4;'}, gMoon);
var moonSub = mk('text', {'text-anchor':'middle', 'class':'data',
  style:'font-size:0.625em;font-weight:800;letter-spacing:.12em;fill:rgba(244,233,212,.7);'}, gMoon);
/* the moon's own fleet: the robots that live there — real craft on
   schematic rings (their true ~2-hour polar orbits are edge-on from
   overhead; a circling dot at the real rate is the honest cartoon).
   Caption appears with the zoom sprites. */
var MOON_FLEET = [
  {nm:'LRO',           per:113, r:22.5, ph:0.15, c:'#cfe0f4'},
  {nm:'DANURI',        per:120, r:25.5, ph:0.62, c:'#a8d8c4'},
  {nm:'CHANDRAYAAN‑2', per:127, r:28.5, ph:0.88, c:'#e8c9a0'}
];
MOON_FLEET.forEach(function(o, i){
  /* each craft rides its own faint ring as a tiny bus+wings spacecraft
     (the fleet glyph, moon-sized), wings tangent to the ring. Its name
     CURVES along the ring beside it (the ring-title treatment) — a
     top-run and a bottom-run arc per ring, swapped by hemisphere so the
     text stays upright, startOffset tracking the craft each frame. */
  mk('circle', {r:o.r, fill:'none', stroke:'rgba(232,214,180,.16)', 'stroke-width':.6,
                'stroke-dasharray':'2 4', 'vector-effect':'non-scaling-stroke'}, moonG);
  var wingC = shade(o.c, -0.32);
  o.el = mk('g', {'pointer-events':'none'}, moonG);
  mk('rect', {x:-2.05, y:-0.6, width:1.25, height:1.2, fill:wingC, opacity:.92}, o.el);
  mk('rect', {x:0.8,   y:-0.6, width:1.25, height:1.2, fill:wingC, opacity:.92}, o.el);
  mk('rect', {x:-0.8,  y:-0.7, width:1.6,  height:1.4, rx:0.25, fill:o.c}, o.el);
  var rl = o.r + 3.1;
  var P = function(a){ return (rl*Math.cos(a*DEG)).toFixed(1) + ' ' + (rl*Math.sin(a*DEG)).toFixed(1); };
  mk('path', {id:'mflab' + i + 't', fill:'none',
    d:'M' + P(140) + 'A' + rl + ' ' + rl + ' 0 1 1 ' + P(400)}, moonG);
  mk('path', {id:'mflab' + i + 'b', fill:'none',
    d:'M' + P(220) + 'A' + rl + ' ' + rl + ' 0 1 0 ' + P(-40)}, moonG);
  o.lab = mk('text', {'text-anchor':'middle', 'class':'data', display:'none',
    style:'font-size:0.45em;font-weight:800;letter-spacing:.11em;fill:' + o.c + ';' +
          'paint-order:stroke;stroke:#070d1d;stroke-width:.3em;stroke-linejoin:round;stroke-opacity:.85;'}, moonG);
  o.tp = mk('textPath', {href:'#mflab' + i + 't', startOffset:'50%'}, o.lab);
  o.tp.textContent = o.nm;
});

/* Lagrange stations (not in the GP groups — placed from the sun direction) */
var LPTS = [ {nm:'DSCOVR · L1', toSun:1,  node:null, lab:null, spr:'sprites/dscovr.png', sw:12, sh:6.8},
             {nm:'JWST · L2',   toSun:-1, node:null, lab:null, spr:'sprites/jwst.png',   sw:15, sh:11.3} ];
LPTS.forEach(function(L){
  L.node = mk('path', {d:'M0,-4 L4,0 L0,4 L-4,0 Z', fill:'#cfd8f4', stroke:'#fff', 'stroke-width':.5}, gSats);
  L.lab = mk('text', {'text-anchor':'middle', 'class':'data',
    style:'font-size:0.5938em;font-weight:800;letter-spacing:.1em;fill:rgba(207,216,244,.8);'}, gSats);
  L.lab.textContent = L.nm;
  /* zoom-gated real render (NASA model series, PD) — replaces the diamond */
  L.img = mk('image', {'data-src':L.spr, x:(-L.sw/2).toFixed(1), y:(-L.sh/2).toFixed(1),
                       width:L.sw, height:L.sh, preserveAspectRatio:'xMidYMid meet',
                       'pointer-events':'none'}, document.getElementById('gSprites'));
});

/* earth: gradient base, live EPIC photo when it arrives, true night half.
   The blue halo is SCATTERED SUNLIGHT — it exists only where the limb is
   lit, so the glow rides a sun-rotating mask (bright sunward, dying past
   the terminator); the night limb keeps only a whisper of real airglow. */
var earthGlowG = mk('g', {mask:'url(#dayGlowMask)'}, gEarth);
mk('circle', {r:58, fill:'url(#atmoGlow)'}, earthGlowG);
mk('circle', {r:47.5, fill:'none', stroke:'#b8d8c8', 'stroke-width':.5, opacity:.08}, gEarth);
mk('circle', {r:46, fill:'url(#earthGrad)'}, gEarth);
var earthImgG = mk('g', {'clip-path':'url(#earthClip)'}, gEarth);
var earthImg = null;   // attached on EPIC success
var earthNightG = mk('g', {'clip-path':'url(#earthClip)'}, gEarth);
var earthNightP = mk('path', {d:'M0,-46 A46,46 0 0 0 0,46 L0,-46 Z', fill:'url(#nightSide)',
                              filter:'url(#softTerm)'}, earthNightG);
var earthRim = mk('circle', {r:44.6, fill:'none', stroke:'url(#dayRim)', 'stroke-width':2.6, opacity:.9}, gEarth);
mk('circle', {r:46.9, fill:'none', stroke:'#cfe8ff', 'stroke-width':.55, opacity:.5}, earthGlowG);
mk('circle', {r:48.4, fill:'none', stroke:'#7fb2ff', 'stroke-width':1.7, opacity:.13}, earthGlowG);
var earthLab = mk('text', {y:70, 'text-anchor':'middle',
  style:'font-size:1.1875em;font-weight:850;letter-spacing:.2em;fill:#dce6f8;'}, gEarth);
earthLab.textContent = 'EARTH';

/* ── eclipse visuals, driven by eclipseState(curMs) in render() ──
   lunar: the umbra BRIDGES from its GEO cap out to the moon's ring (the one
   time the flat idiom is right to reach that far) and the moon goes blood
   red. solar: the moon's own shadow cones back onto the earth, landing as
   a soft dark spot on the disc. */
var eclBridge = mk('path', {display:'none', fill:'url(#umbraTail)', filter:'url(#eclSoft)'}, gShadow);
var eclCone   = mk('path', {display:'none', fill:'url(#coneTail)', filter:'url(#eclSoft)'}, gShadow);
/* the blood disc: copper radial gradient MULTIPLIED over the real photo
   (dark limb, glowing core) + a dim red halo breathing around the moon */
var eclGlow   = mk('circle', {r:31, fill:'url(#bloodHalo)', opacity:0, 'pointer-events':'none'}, moonG);
var eclBlood  = mk('circle', {r:18.6, fill:'url(#bloodGrad)', opacity:0,
                              style:'mix-blend-mode:multiply;', 'pointer-events':'none'}, moonG);
/* the solar spot: umbra core with a penumbral fade, growing with depth */
var eclSpot   = mk('circle', {r:6, fill:'url(#eclSpotGrad)', display:'none',
                              'pointer-events':'none'}, gEarth);

/* EPIC — CORS-open JSON; jpg not png (218 KB vs 3 MB); disc r = 0.392 of frame */
(function(){
  fetch('https://epic.gsfc.nasa.gov/api/natural').then(function(r){ return r.json(); })
  .then(function(list){
    if (!list || !list.length) return;
    var m = list[list.length - 1];
    var d = m.date.slice(0,10).split('-');
    var url = 'https://epic.gsfc.nasa.gov/archive/natural/' + d[0] + '/' + d[1] + '/' + d[2] +
              '/jpg/' + m.image + '.jpg';
    var half = 46 / 0.392;
    earthImg = mk('image', {href:url, x:-half, y:-half, width:half*2, height:half*2,
                            preserveAspectRatio:'xMidYMid slice', opacity:0,
                            style:'transition:opacity .8s ease;'}, earthImgG);
    earthImg.addEventListener('load', function(){
      earthImg.setAttribute('opacity', 1);
      /* the blue dot only goes on once the real photo is up — never on
         the fallback gradient */
      _epicMeta = m;
      placeLocPin();
    });
  }).catch(function(){});
})();

/* the location pin: LOCATION projected onto THIS frame (orthographic from
   the image's own centroid viewpoint, EPIC frames are north-up), so the
   marker sits where the city really is in the photo. Only drawn when the
   site is on the visible face. Redrawn from scratch whenever the host
   switches location — the old pin comes out first. */
var _epicMeta = null, _locHost = null;
function placeLocPin(){
  if (_locHost){ try{ _locHost.parentNode.removeChild(_locHost); }catch(_){} _locHost = null; }
  _locMark = null; _locLab = null;
  var c = _epicMeta && _epicMeta.centroid_coordinates;
  if (!c || typeof c.lat !== 'number') return;
  var p0 = c.lat * DEG, ph = LOCATION.lat * DEG, dl = (LOCATION.lon - c.lon) * DEG;
  var cosc = Math.sin(p0)*Math.sin(ph) + Math.cos(p0)*Math.cos(ph)*Math.cos(dl);
  if (cosc < 0.05) return;
  var hx = Math.cos(ph)*Math.sin(dl) * 46;
  var hy = (Math.cos(p0)*Math.sin(ph) - Math.sin(p0)*Math.cos(ph)*Math.cos(dl)) * 46;
  /* a proper location ping: tiny dot + radiating pulse, counter-scaled
     in applyView so it keeps a constant on-screen size at any zoom
     (circles don't ride the root-font trick the way text does) */
  var hg = mk('g', {transform:'translate(' + hx.toFixed(1) + ',' + (-hy).toFixed(1) + ')'}, gEarth);
  _locHost = hg;
  _locMark = mk('g', {}, hg);
  /* a proper pin: ground pulse at the tip, soft ground shadow, teardrop
     body with a white core — the tip touches the exact spot */
  var gp = mk('ellipse', {cx:0, cy:0, rx:1.5, ry:.6, fill:'none', stroke:'#2B22F4', 'stroke-width':.35, opacity:.5}, _locMark);
  mk('animate', {attributeName:'rx', values:'1.2;3.6', dur:'2.6s', repeatCount:'indefinite'}, gp);
  mk('animate', {attributeName:'ry', values:'.5;1.5', dur:'2.6s', repeatCount:'indefinite'}, gp);

      var mm2 = moonNow(new Date(curMs));
      var mR4 = rKm(mm2.dist * 6378.14);
      var mp4 = dirXY(mm2.lon * DEG, mR4);
      if (kind === 'lunar'){
        animateView(mp4[0] - 85, mp4[1] - vbH(170) * 0.45, 170);
      } else {
        var w4 = mR4 * 1.55 + 120;
        animateView(mp4[0] / 2 - w4 / 2, mp4[1] / 2 - vbH(w4) / 2, w4);
      }
      setTimeout(render, 320);
    });
  });
  var sm = document.getElementById('strip-moon');
  if (sm)
    sm.addEventListener('click', function(ev){
      /* fly the map to the real moon first — the LRO-textured disc with
         its named fleet circling — then open the site's moon popup on
         arrival (clamped: this page can't scroll) */
      var mm = moonNow(new Date(curMs));
      var mR2 = rKm(mm.dist * 6378.14);
      var mp2 = dirXY(mm.lon * DEG, mR2);
      var w = 150;
      /* the docked panel takes the left ~27% — land the moon right of it */
      animateView(mp2[0] - w * 0.62, mp2[1] - vbH(w) * 0.42, w);
      setTimeout(function(){
        render();                       // paused frames skip render — surface the fleet labels
        if (typeof showPlanetInsight !== 'function') return;
        document.documentElement.style.setProperty('--stage-h',
          document.getElementById('stage').getBoundingClientRect().height + 'px');
        document.documentElement.classList.add('moon-dock');
        showPlanetInsight('moon', '#c8ccd8', ev);
        var un = setInterval(function(){
          if (!document.getElementById('planet-insight-popup')){
            document.documentElement.classList.remove('moon-dock');
            clearInterval(un);
          }
        }, 400);
      }, 340);
    });
}
/* find the next lunar + solar eclipse once, off the boot path (the syzygy
   scan walks hourly steps through up to 50 lunations) */
setTimeout(function(){
  _nextEcl = { lunar: nextEclipse('lunar'), solar: nextEclipse('solar') };
  renderFacts();
  /* the layout is settled now (eclipse strip in, facts final) — tell the
     host to lift its loading veil */
  try { parent.postMessage({earthReady: true}, '*'); } catch (_){ }
}, 600);

/* live solar activity for the SUN strip — the current NOAA R/S/G scales
   (one tiny CORS-open fetch); calm most days, storm codes when not */
var _sunAct = null;
fetch('https://services.swpc.noaa.gov/products/noaa-scales.json')
  .then(function(r){ return r.json(); })
  .then(function(d){
    var c = d && d['0'];
    if (!c) return;
    var codes = ['R', 'S', 'G'].filter(function(k){ return c[k] && +c[k].Scale > 0; })
                               .map(function(k){ return k + c[k].Scale; });
    _sunAct = codes.length ? codes.join(' ') + ' — ' +
      (c.G && +c.G.Scale > 0 ? 'GEOMAGNETIC STORM' : c.R && +c.R.Scale > 0 ? 'RADIO BLACKOUT' : 'RADIATION STORM')
      : 'CALM';
    renderFacts();
  }).catch(function(){});

function frame(ts){
  if (playing){
    if (lastFrame !== null) curMs += (ts - lastFrame) * (+speedSel.value) * 86400;
    lastFrame = ts;
    render();
  }
  requestAnimationFrame(frame);
}
function syncPlayBtn(){
  document.getElementById('btn-play').innerHTML =
    playing ? '&#10073;&#10073;&#xFE0E; PAUSE' : '&#9654;&#xFE0E; PLAY';
}
document.getElementById('btn-play').addEventListener('click', function(){
  playing = !playing; lastFrame = null;
  syncPlayBtn();
});
/* host visibility: the site posts {earthVisible} when the widget scrolls
   off screen or another tab covers this frame — pause the playback loop
   (rAF render at 60fps otherwise burns battery unseen) and resume where
   it left off when the frame comes back */
var hostVisible = true, wasPlaying = false;
/* map-height contract with the host (desktop only): {spaceMapH:px} pins
   #stage, {spaceHeight:px} answers with our content height so the frame can
   grow around the fact ledger. 0 restores the flex layout (phones). */
var _mapH = 0, _lastH = 0;
function reportHeight(){
  if (!_mapH) return;
  var h = document.body.scrollHeight;
  if (Math.abs(h - _lastH) < 1) return;
  _lastH = h;
  try{ window.parent.postMessage({spaceHeight: h}, '*'); }catch(_){}
}
function setMapH(h){
  _mapH = h | 0;
  var st = document.getElementById('stage');
  document.documentElement.classList.toggle('fixed-map', _mapH > 0);
  if (st) st.style.height = _mapH > 0 ? _mapH + 'px' : '';
  try{ render(); }catch(_){}
  _lastH = 0;
  reportHeight();
}
if (window.ResizeObserver) new ResizeObserver(function(){ reportHeight(); }).observe(document.body);
window.addEventListener('message', function(e){
  if (e.data && typeof e.data.spaceMapH === 'number'){ setMapH(e.data.spaceMapH); return; }
  /* the site's ISS TRACKER card jumps straight into the live view. The
     host pokes repeatedly until this frame is booted — the .on guard
     makes every poke after the first a no-op (a re-open would restart
     the stream). */
  if (e.data && e.data.openIssLive){
    if (!document.getElementById('live-view').classList.contains('on')) openIssLive();
    return;
  }
  /* the site location: the lab boots on NYC, the host hands over the real
     one at load and on every switch — pin moves, readout clock follows */
  if (e.data && e.data.bvLocation){
    var L = e.data.bvLocation;
    if (typeof L.lat === 'number' && typeof L.lon === 'number' &&
        (Math.abs(L.lat - LOCATION.lat) > 1e-6 || Math.abs(L.lon - LOCATION.lon) > 1e-6 ||
         (L.tz && L.tz !== LOCATION.tz) || (L.name && L.name !== LOCATION.name))){
      LOCATION.lat = L.lat; LOCATION.lon = L.lon;
      if (L.tz) LOCATION.tz = L.tz;
      if (L.name) LOCATION.name = L.name;
      placeLocPin();
      render();
    }
    return;
  }
  if (!e.data || typeof e.data.earthVisible !== 'boolean') return;
  var v = e.data.earthVisible;
  if (v === hostVisible) return;
  hostVisible = v;
  if (!v){
    wasPlaying = playing;
    if (playing){ playing = false; lastFrame = null; syncPlayBtn(); }
  } else {
    if (wasPlaying && !playing){ playing = true; lastFrame = null; syncPlayBtn(); }
    else if (!playing){ curMs = Date.now(); render(); }   // catch up the "now" view
  }
});
document.getElementById('btn-today').addEventListener('click', function(){
  curMs = Date.now(); render();
});
/* the date readout IS a calendar: an invisible native date input overlays
   the pill, so a tap pops the picker — any date back to 1958 scrubs the map */
var datePick = document.getElementById('date-pick');
datePick.addEventListener('click', function(){ try{ this.showPicker(); }catch(_){} });
datePick.addEventListener('change', function(){
  if (!this.value) return;
  var p = this.value.split('-');
  var t = new Date(curMs);                 // keep the time of day
  t.setFullYear(+p[0], +p[1] - 1, +p[2]);
  curMs = t.getTime();
  render();
});
render();
renderFacts();
setInterval(function(){ if (!playing && hostVisible){ curMs = Date.now(); render(); } }, 30000);
setInterval(renderFacts, 60000);
requestAnimationFrame(frame);
</script>
</body>
</html>
