# THE NIGHTLY REFIT. The bake learns on its own every day -- bias windows, the
# record, the published-forecast trail, the plan's graded bets, the minute
# replay -- but the timing study (which hours pay, hold versus exit, the
# calibration haircut) was a hand-run script until 2026-09-06 ("confirm that
# the system will take notes from what happened in all 3 markets today").
# This replays yesterday's real quotes into it once the day has settled, so
# tomorrow's windows and verdicts include today.
name: Kalshi nightly refit
on:
  schedule:
    - cron: '20 8 * * *'          # 08:20Z = 4:20 AM ET, after the official climate reports
  workflow_dispatch: {}
concurrency:
  group: kalshi-nightly
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signing library
        run: pip install --quiet cryptography
      - name: Refit the timing, exit and calibration studies on the three cities
        run: |
          python3 -u _kalshi/price_study.py --city ny,las,aus
          python3 -u _kalshi/trail_study.py || echo "trail study failed (kept going)"
          python3 -u _kalshi/peak_stats.py || echo "peak stats failed (kept going)"
      - name: Commit if changed
        run: |
          set -euo pipefail
          # stage FIRST: a file the study writes for the first time is untracked,
          # and `git diff --quiet` never sees an untracked file -- trail_study.json
          # was written every night and never committed (found 2026-09-07)
          git add _kalshi/price_study.json _kalshi/peak_stats.json _kalshi/trail_study.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Kalshi nightly refit: hour windows, exit policy and calibration on the three cities"
          # THE PUSH RACE (found 2026-09-07): the bake pushes every five minutes,
          # so a plain push is rejected about half the time. The study scripts
          # also leave modified caches in the tree, and `git rebase` refuses
          # with unstaged changes -- which is how the first CI tune run failed
          # AFTER a clean nine-minute replay. Discard everything not committed,
          # then rebase and retry.
          OURS=$(git rev-parse HEAD)
          git checkout -- . || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git reset --hard origin/main; git checkout "$OURS" -- _kalshi/price_study.json _kalshi/peak_stats.json _kalshi/trail_study.json; git commit -m "Kalshi nightly refit"; }
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
