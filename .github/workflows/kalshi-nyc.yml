name: Kalshi daily highs

# Refreshes /kalshi_ny.json — the live Kalshi KXHIGHNY ladder, our own
# probability for each bracket, the locked daily pick, and the running record.
# Feeds the Belvedere Castle popup on the CITY map.
#
# It runs as a job rather than a browser fetch because Kalshi answers 403 to
# any request carrying an Origin header (our proxy worker is 403'd too), so
# the page cannot reach the market directly. It reads our own repo instead.
#
# The decision for each day is LOCKED at the first run at or after 12:00 ET
# and never rewritten — that is what makes the record an honest forecast
# score rather than hindsight.

# SCHEDULING NOTE. GitHub queues these best-effort and skips most under load --
# 2 of ~10 slots on the job's first day, and never once in the 6pm window that
# writes the final call. A Cloudflare Worker (_kalshi/cron-worker/) now fires
# workflow_dispatch every 15 minutes instead, because its cron actually runs on
# time. (Hourly until 2026-09-05, when parallelising the rain step took a full
# run from ~20 minutes to ~5 and made four an hour safe.)
#
# The schedule below is kept DELIBERATELY, as a fallback for if the worker or its
# token ever dies. Once the worker is confirmed dispatching, this can be trimmed
# to just the two lock windows ('25 16,22 * * *') to stop duplicate runs; until
# then it stays as-is so nothing is left unscheduled.
on:
  schedule:
    # hourly across the NYC daylight window, in UTC (ET = UTC-4 in season):
    # 12:00–23:00 UTC = 08:00–19:00 ET, then 00:00–04:00 UTC = 20:00–00:00 ET
    - cron: '25 16,22 * * *'
    # Trimmed to a FALLBACK now that the Cloudflare worker is confirmed
    # dispatching (first worker-triggered run 2026-09-04T23:06Z). These two
    # slots are the ones that write the locks -- 16:00 UTC is noon ET, 22:00 UTC
    # is 6pm ET -- so if the worker or its token ever dies, the record still
    # gets both calls at roughly a 25% hit rate per slot rather than nothing.
    # Everything else, including the hourly price trail, comes from the worker.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kalshi-nyc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # seven markets against three upstreams; well past this and something is
    # wedged, and an hourly job must not sit there burning the next slot
    # 15 was not enough: seven markets on a runner take ~2.5 min each against
    # ~10s on a laptop, so a third-party feed is throttling that network. Raised
    # while the per-host timing says which one; this is a symptom fix.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # only needed to sign portfolio requests; the job runs fine without it
      - name: Install signing library
        run: pip install --quiet cryptography

      - name: Fetch market, forecast and observations
        # These two are optional. Set them under Settings -> Secrets and
        # variables -> Actions to import real fills from Kalshi; with either
        # absent the job skips the portfolio call and _kalshi/trades.csv stays
        # the ledger. The key is never read from or written to this repo.
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        # -u so the log streams. Buffered, a five-minute run shows nothing at
        # all until it exits, which is indistinguishable from a hang.
        # THE RAIN BOARD RUNS ALONGSIDE, not after. As two steps the job was
        # five minutes of temperature then six of rain, and the file landed
        # 10-15 minutes after each 15-minute dispatch. The two touch different
        # files, so rain runs in the background and is waited for at the end;
        # its failure still cannot cost the temperature markets their run.
        run: |
          python3 -u _kalshi/kalshi_daily.py
          # the post-mortem: Central Park's one-minute archive, days behind, replayed
          # once the day has settled. Self-throttled to a few requests a day.
          python3 -u _kalshi/minute_replay.py || echo "minute replay failed (kept going)"

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- kalshi_*.json; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kalshi_*.json
          git commit -m "Kalshi daily highs: refresh market, probabilities and record"
          # Anything pushed to main while this ran -- another hourly run, or a
          # commit from a laptop -- makes this push a non-fast-forward.
          #
          # A rebase was the first answer and it FAILED on 2026-09-05: the laptop
          # had rewritten the same kalshi_*.json while the job ran, the rebase
          # stopped on a conflict in those one-line files, and the job exited
          # having thrown away 19 minutes of fresh market data. The site sat on a
          # 3 AM bake until 8 AM.
          #
          # There is nothing to MERGE here. These files are regenerated whole and
          # ours is the newer read of the market, so take whatever landed on main
          # and lay ours back on top. Nothing else in the tree is touched.
          # ONLY THE FILES THIS RUN CHANGED travel to the replay. Laying every
          # kalshi_*.json back over origin also laid back files this run never
          # touched -- on 2026-09-06 a runner that started before a push
          # replaced the new per-city kalshi_minutes.json with its stale copy.
          changed="$(git diff --name-only -- kalshi_*.json)"
          echo "changed: $changed"
          tmp="$(mktemp -d)"
          for f in $changed; do cp "$f" "$tmp"/; done
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, replaying onto origin/main (attempt $i)"
            git fetch origin main
            git reset --hard origin/main
            for f in $changed; do cp "$tmp"/"$(basename "$f")" "$f"; done
            # the head file is written by two lanes now; merge it per market
            # rather than laying ours over whatever the other lane just pushed
            git show origin/main:kalshi_ny.json > "$tmp"/origin_ny.json 2>/dev/null \
              && python3 _kalshi/merge_head.py "$tmp"/origin_ny.json "$tmp"/kalshi_ny.json kalshi_ny.json || true
            if git diff --quiet -- kalshi_*.json; then
              echo "origin already has this data"; exit 0
            fi
            git add kalshi_*.json
            git commit -m "Kalshi daily highs: refresh market, probabilities and record"
          done
          echo "could not push after 3 attempts"; exit 1
