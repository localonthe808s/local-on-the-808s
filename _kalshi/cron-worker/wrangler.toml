# Cloudflare Worker: the clock for the Kalshi daily job.
#
# Separate from the repo-root wrangler.toml, which belongs to the CORS proxy
# (bluish-void-proxy). A wrangler.toml describes exactly one worker, so this one
# lives in its own directory and is deployed from here:
#
#   cd _kalshi/cron-worker
#   wrangler secret put GH_TOKEN     # fine-grained PAT, Actions: read+write
#   wrangler deploy
#
# No route is declared — this worker is never meant to serve bluishvoid.com
# traffic. It runs on its cron triggers and keeps its workers.dev URL only as a
# status page.

name = "bluish-void-kalshi-cron"
main = "kalshi-cron.js"
compatibility_date = "2026-09-04"

# This worker is a status page, not a service. It needs no preview hostnames,
# and each one is another public URL answering questions about the repo.
#
# MUST live up here with the other top-level keys. Put after a table header it
# is parsed as a member of that table -- which is what happened on the first
# attempt, and wrangler said so: "Unexpected fields found in observability
# field: preview_urls".
preview_urls = false

# Cron triggers are UTC. Eastern is UTC-4 in season, so:
#   12:00-23:00 UTC = 08:00-19:00 ET   (covers the noon lock at 16:00 UTC)
#   00:00-04:00 UTC = 20:00-00:00 ET   (covers the 6pm final at 22:00 UTC)
#
# EVERY 15 MINUTES, since 2026-09-05. It was hourly because the job took ~20
# minutes and could not safely be asked for more; parallelising the rain step
# (66 serial requests -> a pool of 4) brought a full run to about 5 minutes, so
# four runs an hour no longer overlap.
#
# The offsets are 5,20,35,50 rather than 0,15,30,45 to stay off the top of the
# hour, where every cron on the platform fires at once.
#
# This does NOT quadruple the price trail: kalshi_daily appends a trail row only
# when the hour changes, so the record stays one row per hour and the SYSTEM
# box's RUNS light keeps counting the same thing. What it buys is a fresher
# ladder on the panel -- the 25-minute-old quote that made a 40c ask read as
# real when the market had already moved to 35c.
#
# Two expressions keeps this inside the free plan's cron-trigger limit.
[triggers]
# :50, and NOT :56 -- the second measurement corrected the first.
#
# The minute candles say the market reprices at :54, three minutes after Central
# Park reports at :51, so :56 looked like the slot that would catch a fresh
# observation. It does not. The market reads METAR directly; we read IEM, and
# IEM publishes that observation 10-15 minutes late. Measured 2026-09-05: at
# 13:20 the newest ob available was 12:51, and the 12:56 bake had carried 11:51.
#
# So :56 sits in the gap where this hour's ob does not exist yet and the bake
# takes last hour's -- 65 minutes old, worse than the 59 that :50 gives.
#
# Ob age by slot, given a ~15 minute IEM lag:
#     :05 -> 14 min      :20 -> 29 min      :35 -> 44 min      :50 -> 59 min
#
# :05 is the valuable run and always was. The real fix for the lag is a faster
# observation source, not a different minute.
# EVERY FIVE MINUTES since 2026-09-05, and NOT because the daily job wants it.
#
# The observation trail records TWC's temperatureMaxSince7Am, which is a
# current-only field: no archive, no backfill, so a reading nobody asked for at
# 2:35 PM does not exist afterwards. Five minutes is the resolution the question
# needs -- whether that field leads IEM daily, and by how long.
#
# Still TWO expressions, which is what keeps this inside the free plan's
# cron-trigger limit. The daily job has NOT gone to twelve runs an hour: the
# scheduled handler logs on every tick and dispatches only on minutes 5, 20, 35
# and 50, the same four it always used. A full kalshi_daily run takes about five
# minutes and overlapping runs would trip over each other.
crons = [
  "* 12-23 * * *",
  "* 0-4 * * *"
]

# WHERE THE TRAIL LIVES.  One key per tick, ~192 a day against the free plan's
# 1000 writes, expiring after 120 days. Create it once and paste the id here:
#
#   wrangler kv namespace create OBS
#
# Without this binding the worker still dispatches exactly as before and simply
# reports "NO KV BINDING - not logging" on its status page, so a missing
# namespace degrades the new job without touching the old one.
[[kv_namespaces]]
binding = "OBS"
id = "fd27fe18583246c292e108e2f2714ac0"

# SETTINGS THE DASHBOARD HAD AND THIS FILE DID NOT.  A deploy overwrites the
# remote config with whatever is in here, so anything absent silently reverts to
# a default. The 2026-09-05 deploy turned observability OFF and preview URLs ON
# without being asked to -- both were the opposite in the dashboard. Pinned now,
# so the next deploy cannot quietly undo them again.
#
# Logs are the point: `wrangler tail` and the dashboard's log view are the only
# place a failed dispatch is visible, since a dispatch that never happens
# creates no Actions run to go looking at.
[observability]
enabled = true

[observability.logs]
enabled = true
